# A suppression must still match a finding.
extend-enable = ["MD087"]

[per-file-ignores]
# History starts with the archival warning and keeps separate top-level session sections.
"docs/history/**/*.md" = ["MD025", "MD041"]
# Claude imports the repository instructions through this one-line reference.
"CLAUDE.md" = ["MD041"]
